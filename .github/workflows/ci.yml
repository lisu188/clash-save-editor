name: CI

on:
  push:
    branches:
      - main
      - codex/recovered-full-save-layout
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        shell: bash
        run: |
          set +e
          ./gradlew test --stacktrace --console=plain 2>&1 | tee gradle-test.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload Gradle test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
      - name: Publish concise failure
        if: failure()
        shell: bash
        run: grep -E '(^e: |^w: |FAILURE:|What went wrong|Execution failed|There were failing tests|> Task .*FAILED|^[[:space:]]+[A-Za-z0-9_].*Test > .*FAILED)' gradle-test.log | tail -n 200 || true
