name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public-source boundary
        run: python tools/check-public-boundary.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew test -PstudioPreviewDir=build/reports/ui --stacktrace --console=plain
      - name: Test and package Windows application
        if: runner.os == 'Windows'
        run: ./gradlew.bat test :desktop:portableZip :mcp:fatJar -PstudioPreviewDir=build/reports/ui --stacktrace --console=plain
      - name: Verify bundled MCP runtime and protocol
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-package.ps1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}
          path: |
            core/build/reports/tests/
            desktop/build/reports/tests/
            desktop/build/reports/ui/
            mcp/build/reports/tests/
      - name: Upload Windows distribution
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ClashSaveEditor-windows-x64
          path: desktop/build/distributions/ClashSaveEditor-windows-x64.zip
