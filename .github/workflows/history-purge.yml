name: Purge prohibited history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  purge:
    if: contains(github.event.head_commit.message, '[history-purge]')
    runs-on: ubuntu-latest
    steps:
      - name: Install filter-repo
        run: python -m pip install --disable-pip-version-check git-filter-repo
      - name: Rewrite all public heads and tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo.git
          cd repo.git
          git filter-repo --force --invert-paths --path clash95.c --path save/0.dat
          if git log --all --format=%H -- clash95.c save/0.dat | grep -q .; then
            echo "Prohibited paths remain in rewritten refs" >&2
            exit 1
          fi
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force --all origin
          git push --force --tags origin
